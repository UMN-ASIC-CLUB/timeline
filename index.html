<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UMN ASIC Club — Year One</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080a0f;--surface:#0d1017;--surface2:#131720;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --purple:#8b7ff5;--teal:#2dd4a0;--coral:#f07060;
  --amber:#f5a830;--blue:#5b9cf6;--pink:#e879aa;
  --text:#e8eaf0;--muted:#6b7280;--muted2:#3d4455;
  --mono:'Space Mono',monospace;--sans:'Syne',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(139,127,245,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(139,127,245,.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0}
.glow-a{position:fixed;width:700px;height:700px;border-radius:50%;background:radial-gradient(circle,rgba(139,127,245,.07) 0%,transparent 70%);top:-300px;left:-200px;pointer-events:none;z-index:0}
.glow-b{position:fixed;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(45,212,160,.05) 0%,transparent 70%);bottom:-200px;right:-100px;pointer-events:none;z-index:0}
.page{position:relative;z-index:1}

.hero{padding:80px 64px 48px;max-width:1200px;margin:0 auto}
.hero-tag{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--purple);margin-bottom:18px;display:flex;align-items:center;gap:10px}
.hero-tag::before{content:'';width:28px;height:1px;background:var(--purple)}
.hero h1{font-size:clamp(40px,6vw,76px);font-weight:800;line-height:1.0;letter-spacing:-.025em;background:linear-gradient(140deg,#fff 30%,rgba(255,255,255,.4));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
.chip{font-family:var(--mono);font-size:11px;padding:5px 13px;border:1px solid var(--border2);border-radius:4px;color:var(--muted);letter-spacing:.05em}
.chip.live{border-color:var(--teal);color:var(--teal);position:relative;padding-left:24px}
.chip.live::before{content:'';position:absolute;left:11px;top:50%;transform:translateY(-50%);width:5px;height:5px;background:var(--teal);border-radius:50%;animation:blink 1.4s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
@keyframes fadeslide{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.hero-tag{animation:fadeslide .6s ease both}
.hero h1{animation:fadeslide .6s .1s ease both}
.hero-meta{animation:fadeslide .6s .2s ease both}

/* PROGRESS */
.prog-section{padding:0 64px 8px;max-width:1200px;margin:0 auto}
.prog-dates{display:flex;justify-content:space-between;margin-bottom:6px}
.prog-date{font-family:var(--mono);font-size:10px;color:var(--muted2);letter-spacing:.06em}
.prog-track-wrap{padding:0 3px}
.prog-track{position:relative;height:2px;background:var(--border2);border-radius:99px}
.prog-track::before{content:'';position:absolute;left:-3px;top:50%;transform:translateY(-50%);width:7px;height:7px;border-radius:50%;background:var(--purple)}
.prog-track::after{content:'';position:absolute;right:-3px;top:50%;transform:translateY(-50%);width:7px;height:7px;border-radius:50%;background:var(--muted2)}
.prog-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--purple),var(--teal));width:0;transition:width 1.6s cubic-bezier(.4,0,.2,1);position:relative}
.prog-fill::after{content:'';position:absolute;right:-3px;top:50%;transform:translateY(-50%);width:7px;height:7px;border-radius:50%;background:var(--purple);box-shadow:0 0 10px var(--purple)}
.prog-info{font-family:var(--mono);font-size:10px;color:var(--muted2);text-align:right;margin-top:6px}

/* TIMELINE — full width, no scroll */
.tl-section{padding:52px 64px 0;max-width:1200px;margin:0 auto}
.tl-label{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted2);margin-bottom:24px;display:flex;align-items:center;gap:12px}
.tl-label::after{content:'';flex:1;height:1px;background:var(--border)}

/* Canvas fills its container, height is fixed for above+below cards */
.tl-canvas{position:relative;width:100%;height:500px}

/* Spine */
.spine{position:absolute;top:250px;left:0;right:0;height:2px;background:var(--border2);border-radius:99px}
.spine-fill{position:absolute;left:0;top:0;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--purple),var(--teal));width:0;transition:width 1.8s cubic-bezier(.22,1,.36,1)}

/* Ticks */
.tick{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
.tick-line{width:1px;height:6px;background:var(--muted2);opacity:.4}
.tick-lbl{font-family:var(--mono);font-size:9px;color:var(--muted2);margin-top:4px;white-space:nowrap;letter-spacing:.04em}

/* Now marker */
.now-marker{position:absolute;top:250px;transform:translateX(-50%);width:1px;z-index:30;pointer-events:none}
.now-line-top{width:1px;height:250px;background:linear-gradient(to top,rgba(139,127,245,.4),transparent);position:absolute;bottom:0;left:0}
.now-line-bot{width:1px;height:250px;background:linear-gradient(to bottom,rgba(139,127,245,.4),transparent);position:absolute;top:0;left:0}
.now-dot{position:absolute;top:-5px;left:-5px;width:10px;height:10px;border-radius:50%;background:var(--purple);box-shadow:0 0 0 3px rgba(139,127,245,.2);animation:nowglow 2s ease-in-out infinite}
.now-tag{position:absolute;top:-8px;left:14px;font-family:var(--mono);font-size:9px;color:var(--purple);background:var(--bg);padding:2px 6px;border:1px solid rgba(139,127,245,.35);border-radius:3px;white-space:nowrap}
@keyframes nowglow{0%,100%{box-shadow:0 0 0 3px rgba(139,127,245,.2),0 0 12px var(--purple)}50%{box-shadow:0 0 0 8px rgba(139,127,245,.07),0 0 24px var(--purple)}}

/* Nodes */
.mnode{position:absolute;top:250px;width:0;height:0;z-index:10}
.mnode-dot{position:absolute;width:8px;height:8px;border-radius:50%;border:1.5px solid var(--muted2);background:var(--bg);top:-4px;left:-4px;transition:transform .2s,border-color .2s;cursor:pointer;z-index:2}
.mnode:hover .mnode-dot{transform:scale(1.8);border-color:var(--purple)}
.mnode-dot.done{background:var(--teal);border-color:var(--teal);box-shadow:0 0 8px rgba(45,212,160,.5)}
.mnode-dot.current{background:var(--purple);border-color:var(--purple);box-shadow:0 0 10px var(--purple)}

.mnode-stem{position:absolute;left:0;width:1px;background:rgba(255,255,255,.08)}

.mnode-card{
  position:absolute;left:0;
  width:148px;
  background:var(--surface);border:1px solid var(--border);border-radius:8px;
  padding:10px 12px;
  opacity:0;
  transition:opacity .4s,border-color .2s,box-shadow .2s;
  cursor:pointer;
  transform:translateX(-50%);
}
.mnode-card.show{opacity:1}
.mnode:hover .mnode-card{border-color:var(--border2);box-shadow:0 8px 32px rgba(0,0,0,.7)}

.nc-ph{font-family:var(--mono);font-size:8px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:2px}
.nc-dt{font-family:var(--mono);font-size:9px;color:var(--muted);margin-bottom:4px}
.nc-nm{font-size:12px;font-weight:700;color:var(--text);line-height:1.2;margin-bottom:6px}
.nc-tasks{display:flex;flex-direction:column;gap:2px}
.nc-task{font-size:10px;color:var(--muted);line-height:1.3;padding-left:9px;position:relative}
.nc-task::before{content:'–';position:absolute;left:0;color:var(--muted2);font-family:var(--mono)}
.nc-badge{display:inline-block;font-family:var(--mono);font-size:8px;padding:2px 7px;border-radius:3px;letter-spacing:.07em;margin-top:6px}
.bd-done{background:rgba(45,212,160,.1);color:var(--teal)}
.bd-now{background:rgba(139,127,245,.1);color:var(--purple)}
.bd-soon{background:rgba(255,255,255,.04);color:var(--muted2)}

/* PHASE GRID */
.phases-section{padding:56px 64px 80px;max-width:1200px;margin:0 auto}
.sec-label{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted2);margin-bottom:24px;display:flex;align-items:center;gap:12px}
.sec-label::after{content:'';flex:1;height:1px;background:var(--border)}
.phase-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.pc{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;cursor:pointer;position:relative;overflow:hidden;opacity:0;transform:translateY(12px);transition:opacity .5s,transform .5s,border-color .2s}
.pc::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at top left,var(--accent-dim,transparent),transparent 60%);pointer-events:none}
.pc:hover{border-color:var(--border2)}
.pc.show{opacity:1;transform:translateY(0)}
.pc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.pc-num{font-family:var(--mono);font-size:28px;font-weight:700;color:var(--border2);line-height:1;letter-spacing:-.03em}
.pc-badge{font-family:var(--mono);font-size:9px;padding:3px 9px;border-radius:3px;letter-spacing:.08em}
.pc-date{font-family:var(--mono);font-size:10px;color:var(--muted2);margin-bottom:5px}
.pc-name{font-size:15px;font-weight:700;color:var(--text);margin-bottom:12px;line-height:1.2}
.pc-bar{height:1px;background:var(--border);margin-bottom:12px;border-radius:99px;overflow:hidden}
.pc-bar-fill{height:100%;border-radius:99px;width:0;transition:width 1.2s .4s cubic-bezier(.4,0,.2,1)}
.pc-tasks{display:flex;flex-direction:column;gap:4px}
.pc-task{font-size:12px;color:var(--muted);line-height:1.35;padding-left:12px;position:relative}
.pc-task::before{content:'';position:absolute;left:0;top:6px;width:4px;height:4px;border-radius:50%;background:var(--accent,var(--muted2))}

footer{border-top:1px solid var(--border);padding:28px 64px;max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
footer span{font-family:var(--mono);font-size:10px;color:var(--muted2);letter-spacing:.04em}

@media(max-width:700px){
  .hero,.prog-section,.tl-section,.phases-section,footer{padding-left:24px;padding-right:24px}
  .tl-canvas{height:460px}
}
</style>
</head>
<body>
<div class="glow-a"></div>
<div class="glow-b"></div>
<div class="page">

<header class="hero">
  <div class="hero-tag">UMN ASIC Club</div>
  <h1>Year One<br>Roadmap</h1>
  <div class="hero-meta">
    <div class="chip live" id="chip-today">—</div>
    <div class="chip">10 phases</div>
    <div class="chip">May 2026 → May 2027</div>
    <div class="chip" id="chip-days">—</div>
  </div>
</header>

<section class="prog-section">
  <div class="prog-dates">
    <span class="prog-date">May 11, 2026</span>
    <span class="prog-date" id="prog-mid"></span>
    <span class="prog-date">May 15, 2027</span>
  </div>
  <div class="prog-track-wrap">
    <div class="prog-track"><div class="prog-fill" id="prog-fill"></div></div>
  </div>
  <div class="prog-info" id="prog-info"></div>
</section>

<section class="tl-section">
  <div class="tl-label">timeline</div>
  <div class="tl-canvas" id="canvas">
    <div class="spine" id="spine">
      <div class="spine-fill" id="spine-fill"></div>
    </div>
  </div>
</section>

<section class="phases-section">
  <div class="sec-label">all phases</div>
  <div class="phase-grid" id="phase-grid"></div>
</section>

<footer>
  <span>University of Minnesota Twin Cities · ASIC Club</span>
  <span id="ft-r"></span>
</footer>
</div>

<script>
const START  = new Date("2026-05-11");
const END    = new Date("2027-05-15");
const NOW    = new Date();
const TOTAL  = END - START;
const ELAPSED = Math.min(Math.max(NOW - START, 0), TOTAL);
const PCT    = ELAPSED / TOTAL;

const PHASES = [
  {num:0,date:"2026-05-11",end:"2026-05-31",name:"Lock the plan",accent:"#8b7ff5",
   tasks:["Pick tapeout: 2×2 systolic array","Set up GitHub org, Drive, Discord","Define subteams","Write mission + chip proposal"]},
  {num:1,date:"2026-06-01",end:"2026-06-30",name:"RTL prototype",accent:"#8b7ff5",
   tasks:["Register UMN student group","Build MAC cell (mac.sv)","2×2 systolic array top module","Python NumPy golden model","Write Verilator testbench","Internal design review"]},
  {num:2,date:"2026-07-01",end:"2026-07-31",name:"OpenROAD / TinyTapeout",accent:"#2dd4a0",
   tasks:["Add parallel IO interface","Expand verification suite","Run Yosys/OpenROAD synthesis","Fit to TinyTapeout constraints","README + demo video"]},
  {num:3,date:"2026-08-10",end:"2026-08-31",name:"First tapeout",accent:"#2dd4a0",
   tasks:["Freeze RTL — v0.1-tapeout","Final verification pass","Submit to TinyTapeout / shuttle","Recruitment materials","4-week beginner curriculum"]},
  {num:4,date:"2026-09-01",end:"2026-09-30",name:"Recruitment + training",accent:"#5b9cf6",
   tasks:["Student org fair booth","First mass meeting","Workshop 1: Verilog basics","Workshop 2: Testbench + sim","Workshop 3: OpenROAD flow","Assign members to subteams"]},
  {num:5,date:"2026-10-01",end:"2026-11-15",name:"Funding push",accent:"#f07060",
   tasks:["Finalize 8-slide sponsor deck","Meet ECE/CSE/IEEE leadership","UMN student funding application","Draft UROP proposal","Industry outreach: AMD, Intel, Cadence…"]},
  {num:6,date:"2026-10-15",end:"2026-12-15",name:"Student Silicon Network",accent:"#5b9cf6",
   tasks:["Launch cross-university Discord","Invite Cornell C2S2","Invite GT, Berkeley, UCLA, Purdue","First inter-university call","Shared resource repo"]},
  {num:7,date:"2027-01-05",end:"2027-02-28",name:"FPGA / ASIC MVP",accent:"#e879aa",
   tasks:["Pick MVP: MNIST 0v1 / tiny MLP","FPGA port of systolic array","SPI/UART host interface","Python → hardware end-to-end","Demo video + docs"]},
  {num:8,date:"2027-02-01",end:"2027-03-31",name:"ChipIgnite proposal",accent:"#f5a830",
   tasks:["Study ChipIgnite theme","Adapt project to theme","System: chip + PCB + demo","Write + submit full proposal"]},
  {num:9,date:"2027-04-01",end:"2027-05-15",name:"Public demo + next chip",accent:"#2dd4a0",
   tasks:["Polish MVP for live audience","Present to ECE/CSE/IEEE","Publish GitHub + writeup","Plan second chip","Larger sponsorship push"]},
];

const TICKS = [
  {label:"May '26",date:"2026-05-11"},
  {label:"Jun",    date:"2026-06-01"},
  {label:"Jul",    date:"2026-07-01"},
  {label:"Aug",    date:"2026-08-01"},
  {label:"Sep",    date:"2026-09-01"},
  {label:"Oct",    date:"2026-10-01"},
  {label:"Nov",    date:"2026-11-01"},
  {label:"Dec",    date:"2026-12-01"},
  {label:"Jan '27",date:"2027-01-01"},
  {label:"Feb",    date:"2027-02-01"},
  {label:"Mar",    date:"2027-03-01"},
  {label:"Apr",    date:"2027-04-01"},
  {label:"May '27",date:"2027-05-15"},
];

function pct(ds){ return Math.min(Math.max((new Date(ds)-START)/TOTAL,0),1); }
function status(s,e){
  const sd=new Date(s),ed=new Date(e);
  if(ed<NOW) return "done";
  if(sd<=NOW&&NOW<=ed) return "now";
  return "soon";
}
function fmt(ds){ return new Date(ds).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}); }

document.getElementById("chip-today").textContent =
  NOW.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",year:"numeric"});
document.getElementById("chip-days").textContent =
  Math.max(0,Math.round((NOW-START)/86400000))+" days in";

const mid=new Date((START.getTime()+END.getTime())/2);
document.getElementById("prog-mid").textContent =
  mid.toLocaleDateString("en-US",{month:"short",year:"numeric"});
setTimeout(()=>{
  document.getElementById("prog-fill").style.width=(PCT*100)+"%";
  const rem=Math.max(0,Math.round((END-NOW)/86400000));
  document.getElementById("prog-info").textContent =
    Math.round(PCT*100)+"% through year one · "+rem+" days remaining";
},200);

document.getElementById("ft-r").textContent =
  "First tapeout: Aug 2026  ·  MVP: Feb 2027  ·  Public demo: Apr 2027";

/* ── TIMELINE ── */
/* We use % positions so no fixed pixel canvas width needed */
const canvas = document.getElementById("canvas");
const spine  = document.getElementById("spine");

/* Staggered stem heights — alternating above/below */
const STEMS = [72,84,60,88,68,78,62,82,70,58];

TICKS.forEach(t=>{
  const el=document.createElement("div");
  el.className="tick";
  el.style.left=(pct(t.date)*100)+"%";
  el.innerHTML=`<div class="tick-line"></div><div class="tick-lbl">${t.label}</div>`;
  spine.appendChild(el);
});

setTimeout(()=>{
  document.getElementById("spine-fill").style.width=(PCT*100)+"%";
},300);

/* Now marker */
const nm=document.createElement("div");
nm.className="now-marker";
nm.style.left=(PCT*100)+"%";
nm.innerHTML=`<div class="now-line-top"></div><div class="now-dot"></div><div class="now-line-bot"></div><div class="now-tag">${NOW.toLocaleDateString("en-US",{month:"short",day:"numeric"})}</div>`;
canvas.appendChild(nm);

/* Nodes — use % left, px offsets for stems/cards */
PHASES.forEach((ph,i)=>{
  const x    = (pct(ph.date)*100)+"%";
  const side = i%2===0?"above":"below";
  const stemH= STEMS[i];
  const st   = status(ph.date,ph.end);
  const dotCls= st==="done"?"done":st==="now"?"current":"";
  const bdCls = st==="done"?"bd-done":st==="now"?"bd-now":"bd-soon";
  const bdTxt = st==="done"?"done":st==="now"?"now":"upcoming";

  const node=document.createElement("div");
  node.className=`mnode ${side}`;
  node.style.left=x;

  const stem=document.createElement("div");
  stem.className="mnode-stem";
  stem.style.height=stemH+"px";
  if(side==="above") stem.style.bottom="4px";
  else               stem.style.top="4px";

  const dot=document.createElement("div");
  dot.className=`mnode-dot ${dotCls}`;

  const card=document.createElement("div");
  card.className="mnode-card";
  const cardOff=stemH+12;
  if(side==="above") card.style.bottom=cardOff+"px";
  else               card.style.top=cardOff+"px";

  card.innerHTML=`
    <div class="nc-ph" style="color:${ph.accent}">Phase ${ph.num}</div>
    <div class="nc-dt">${fmt(ph.date)}</div>
    <div class="nc-nm">${ph.name}</div>
    <div class="nc-tasks">${ph.tasks.slice(0,3).map(t=>`<div class="nc-task">${t}</div>`).join("")}</div>
    <span class="nc-badge ${bdCls}">${bdTxt}</span>`;

  node.appendChild(stem);
  node.appendChild(dot);
  node.appendChild(card);
  canvas.appendChild(node);

  setTimeout(()=>card.classList.add("show"), 300+i*70);
});

/* Phase cards */
const grid=document.getElementById("phase-grid");
PHASES.forEach((ph,i)=>{
  const st   =status(ph.date,ph.end);
  const bdCls=st==="done"?"bd-done":st==="now"?"bd-now":"bd-soon";
  const bdTxt=st==="done"?"complete":st==="now"?"in progress":"upcoming";
  let barW=0;
  if(st==="done") barW=100;
  else if(st==="now"){
    const ps=new Date(ph.date),pe=new Date(ph.end);
    barW=Math.round(Math.min(100,Math.max(0,(NOW-ps)/(pe-ps)*100)));
  }
  const numStr=ph.num<10?"0"+ph.num:String(ph.num);
  const pc=document.createElement("div");
  pc.className="pc";
  pc.style.setProperty("--accent",ph.accent);
  pc.style.setProperty("--accent-dim",ph.accent+"18");
  pc.style.transitionDelay=(i*.04)+"s";
  pc.innerHTML=`
    <div class="pc-top">
      <div class="pc-num">${numStr}</div>
      <span class="pc-badge ${bdCls}">${bdTxt}</span>
    </div>
    <div class="pc-date">${fmt(ph.date)} → ${fmt(ph.end)}</div>
    <div class="pc-name">${ph.name}</div>
    <div class="pc-bar"><div class="pc-bar-fill" style="background:${ph.accent};width:${barW}%"></div></div>
    <div class="pc-tasks">${ph.tasks.map(t=>`<div class="pc-task" style="--accent:${ph.accent}">${t}</div>`).join("")}</div>`;
  grid.appendChild(pc);
});

const obs=new IntersectionObserver(entries=>{
  entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add("show");obs.unobserve(e.target);}});
},{threshold:.08});
document.querySelectorAll(".pc").forEach(c=>obs.observe(c));
</script>
</body>
</html>
