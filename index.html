<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UMN ASIC Club — Year One</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080a0f;--surface:#0d1017;--surface2:#131720;
  --border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.11);
  --purple:#8b7ff5;--teal:#2dd4a0;--coral:#f07060;
  --amber:#f5a830;--blue:#5b9cf6;--pink:#e879aa;
  --text:#e8eaf0;--muted:#6b7280;--muted2:#3d4455;
  --mono:'Space Mono',monospace;--sans:'Syne',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--sans);overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(139,127,245,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(139,127,245,.025) 1px,transparent 1px);background-size:48px 48px;pointer-events:none;z-index:0}
.glow-a{position:fixed;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(139,127,245,.06) 0%,transparent 70%);top:-250px;left:-150px;pointer-events:none;z-index:0}
.glow-b{position:fixed;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(45,212,160,.04) 0%,transparent 70%);bottom:-150px;right:-80px;pointer-events:none;z-index:0}
.page{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:0 56px}

.hero{padding:80px 0 52px}
.hero-tag{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--purple);margin-bottom:16px;display:flex;align-items:center;gap:10px}
.hero-tag::before{content:'';width:24px;height:1px;background:var(--purple)}
.hero h1{font-size:clamp(42px,5.5vw,72px);font-weight:800;line-height:1;letter-spacing:-.03em;background:linear-gradient(135deg,#fff 40%,rgba(255,255,255,.35));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px}
.chip{font-family:var(--mono);font-size:10px;padding:5px 12px;border:1px solid var(--border2);border-radius:3px;color:var(--muted);letter-spacing:.04em}
.chip.live{border-color:rgba(45,212,160,.4);color:var(--teal);padding-left:22px;position:relative}
.chip.live::before{content:'';position:absolute;left:10px;top:50%;transform:translateY(-50%);width:5px;height:5px;background:var(--teal);border-radius:50%;animation:blink 1.4s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.1}}

.prog{padding:0 0 16px}
.prog-labels{display:flex;justify-content:space-between;margin-bottom:8px}
.prog-label{font-family:var(--mono);font-size:10px;color:var(--muted2)}
.prog-track{position:relative;height:2px;background:var(--border2);border-radius:99px;margin:0 4px}
.prog-track::before{content:'';position:absolute;left:-4px;top:50%;transform:translateY(-50%);width:8px;height:8px;border-radius:50%;background:var(--purple);box-shadow:0 0 8px rgba(139,127,245,.6)}
.prog-track::after{content:'';position:absolute;right:-4px;top:50%;transform:translateY(-50%);width:8px;height:8px;border-radius:50%;background:var(--muted2)}
.prog-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--purple),var(--teal));width:0;transition:width 1.4s cubic-bezier(.4,0,.2,1);position:relative}
.prog-fill::after{content:'';position:absolute;right:-4px;top:50%;transform:translateY(-50%);width:8px;height:8px;border-radius:50%;background:var(--teal);box-shadow:0 0 8px rgba(45,212,160,.6);transition:all 1.4s cubic-bezier(.4,0,.2,1)}
.prog-sub{font-family:var(--mono);font-size:10px;color:var(--muted2);text-align:right;margin-top:6px}

.sec-label{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted2);margin-bottom:28px;display:flex;align-items:center;gap:12px}
.sec-label::after{content:'';flex:1;height:1px;background:var(--border)}

.tl-wrap{padding:40px 0 0}
.tl-spine-area{position:relative;height:56px}
.tl-spine{position:absolute;top:50%;left:0;right:0;height:1px;background:var(--border2);transform:translateY(-50%)}
.tl-spine-fill{position:absolute;left:0;top:0;height:100%;background:linear-gradient(90deg,var(--purple),var(--teal));width:0;transition:width 1.6s cubic-bezier(.22,1,.36,1)}
.tl-now{position:absolute;top:50%;transform:translate(-50%,-50%);width:10px;height:10px;border-radius:50%;background:var(--purple);box-shadow:0 0 0 3px rgba(139,127,245,.15),0 0 12px rgba(139,127,245,.5);z-index:5;animation:nowglow 2s ease-in-out infinite;pointer-events:none}
@keyframes nowglow{0%,100%{box-shadow:0 0 0 3px rgba(139,127,245,.15),0 0 10px rgba(139,127,245,.5)}50%{box-shadow:0 0 0 7px rgba(139,127,245,.07),0 0 20px rgba(139,127,245,.6)}}
.tl-dot{position:absolute;top:50%;transform:translate(-50%,-50%);width:10px;height:10px;border-radius:50%;border:1.5px solid var(--muted2);background:var(--bg);z-index:3;cursor:pointer;transition:transform .15s,border-color .15s}
.tl-dot:hover{transform:translate(-50%,-50%) scale(1.6);border-color:var(--purple);z-index:4}
.tl-dot.done{background:var(--teal);border-color:var(--teal)}
.tl-dot.current{background:var(--purple);border-color:var(--purple)}

.tl-ticks{position:relative;height:20px}
.tl-tick{position:absolute;transform:translateX(-50%);font-family:var(--mono);font-size:9px;color:var(--muted2);white-space:nowrap;top:4px}
.tl-tick.major{color:rgba(139,127,245,.55)}

/* TOOLTIP — fixed to viewport via JS */
#tooltip{
  position:fixed;
  width:210px;
  background:var(--surface2);
  border:1px solid var(--border2);
  border-radius:10px;
  padding:14px 16px;
  pointer-events:none;
  opacity:0;
  transition:opacity .15s ease;
  z-index:9999;
}
#tooltip.visible{opacity:1}
.tt-phase{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px}
.tt-name{font-size:13px;font-weight:700;color:var(--text);line-height:1.25;margin-bottom:5px}
.tt-dates{font-family:var(--mono);font-size:10px;color:var(--muted);margin-bottom:8px}
.tt-tasks{display:flex;flex-direction:column;gap:3px;margin-bottom:8px}
.tt-task{font-size:11px;color:var(--muted);line-height:1.35;padding-left:10px;position:relative}
.tt-task::before{content:'–';position:absolute;left:0;color:var(--muted2);font-family:var(--mono)}
.tt-badge{display:inline-block;font-family:var(--mono);font-size:9px;padding:2px 8px;border-radius:3px;letter-spacing:.07em}
.bd-done{background:rgba(45,212,160,.08);color:var(--teal);border:1px solid rgba(45,212,160,.2)}
.bd-now{background:rgba(139,127,245,.08);color:var(--purple);border:1px solid rgba(139,127,245,.2)}
.bd-soon{background:rgba(255,255,255,.03);color:var(--muted2);border:1px solid var(--border)}

.phase-list{padding:40px 0 80px}
.ph-row{display:grid;grid-template-columns:80px 1fr 160px;border-top:1px solid var(--border);padding:20px 0;align-items:start;opacity:0;transform:translateY(8px);transition:opacity .4s,transform .4s}
.ph-row.show{opacity:1;transform:translateY(0)}
.ph-row:last-child{border-bottom:1px solid var(--border)}
.ph-num{font-family:var(--mono);font-size:11px;padding-top:2px;opacity:.7}
.ph-name{font-size:15px;font-weight:700;color:rgba(232,234,240,.85);margin-bottom:6px;line-height:1.2}
.ph-tasks{display:flex;flex-direction:column;gap:3px}
.ph-task{font-size:12px;color:var(--muted);line-height:1.4;padding-left:12px;position:relative}
.ph-task::before{content:'';position:absolute;left:0;top:7px;width:3px;height:3px;border-radius:50%;background:var(--muted2)}
.ph-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;padding-top:2px}
.ph-dates{font-family:var(--mono);font-size:10px;color:var(--muted2);text-align:right;line-height:1.6}
.ph-bar{width:100%;height:1px;background:var(--border);border-radius:99px;overflow:hidden;margin-top:2px}
.ph-bar-fill{height:100%;border-radius:99px;width:0;transition:width 1s .5s ease}

footer{border-top:1px solid var(--border);padding:24px 0;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
footer span{font-family:var(--mono);font-size:10px;color:var(--muted2)}
@media(max-width:700px){.page{padding:0 24px}.ph-right{display:none}.ph-row{grid-template-columns:52px 1fr}}
</style>
</head>
<body>
<div class="glow-a"></div>
<div class="glow-b"></div>

<!-- Single shared tooltip rendered at body level -->
<div id="tooltip"></div>

<div class="page">
<header class="hero">
  <div class="hero-tag">UMN ASIC Club</div>
  <h1>Year One<br>Roadmap</h1>
  <div class="hero-meta">
    <div class="chip live" id="chip-today">—</div>
    <div class="chip">10 phases</div>
    <div class="chip">May 2026 → May 2027</div>
    <div class="chip" id="chip-days">—</div>
  </div>
</header>

<div class="prog">
  <div class="prog-labels">
    <span class="prog-label">May 11, 2026</span>
    <span class="prog-label" id="prog-mid"></span>
    <span class="prog-label">May 15, 2027</span>
  </div>
  <div class="prog-track"><div class="prog-fill" id="prog-fill"></div></div>
  <div class="prog-sub" id="prog-sub"></div>
</div>

<div class="tl-wrap">
  <div class="sec-label">timeline</div>
  <div class="tl-spine-area" id="spine-area">
    <div class="tl-spine" id="spine">
      <div class="tl-spine-fill" id="spine-fill"></div>
    </div>
  </div>
  <div class="tl-ticks" id="ticks"></div>
</div>

<div class="phase-list" style="margin-top:48px">
  <div class="sec-label">phases</div>
  <div id="phase-list"></div>
</div>

<footer>
  <span>University of Minnesota Twin Cities · ASIC Club</span>
  <span>First tapeout Aug 2026 · MVP Feb 2027 · Public demo Apr 2027</span>
</footer>
</div>

<script>
const START = new Date("2026-05-11");
const END   = new Date("2027-05-15");
const NOW   = new Date();
const TOTAL = END - START;
const PCT   = Math.min(Math.max((NOW - START) / TOTAL, 0), 1);

const PHASES = [
  {num:0,date:"2026-05-11",end:"2026-05-31",name:"Lock the plan",accent:"#8b7ff5",
   tasks:["Pick tapeout: 2×2 systolic array","Set up GitHub org, Drive, Discord","Define subteams & write chip proposal"]},
  {num:1,date:"2026-06-01",end:"2026-06-30",name:"RTL prototype",accent:"#8b7ff5",
   tasks:["Build MAC cell + 2×2 systolic array","Python NumPy golden model","Verilator testbench + design review"]},
  {num:2,date:"2026-07-01",end:"2026-07-31",name:"OpenROAD / TinyTapeout",accent:"#2dd4a0",
   tasks:["Parallel IO interface + verification","Run Yosys / OpenROAD synthesis","Fit TinyTapeout constraints + README"]},
  {num:3,date:"2026-08-10",end:"2026-08-31",name:"First tapeout",accent:"#2dd4a0",
   tasks:["Freeze RTL v0.1, final verify","Submit to TinyTapeout shuttle","Prep recruitment + beginner curriculum"]},
  {num:4,date:"2026-09-01",end:"2026-09-30",name:"Recruitment + training",accent:"#5b9cf6",
   tasks:["Student org fair + first meeting","Workshops: Verilog, testbench, OpenROAD","Assign members to subteams"]},
  {num:5,date:"2026-10-01",end:"2026-11-15",name:"Funding push",accent:"#f07060",
   tasks:["Sponsor deck + ECE/CSE/IEEE meetings","UMN student funding + UROP proposal","Industry outreach: AMD, Intel, Cadence"]},
  {num:6,date:"2026-10-15",end:"2026-12-15",name:"Student Silicon Network",accent:"#5b9cf6",
   tasks:["Launch cross-university Discord","Invite Cornell C2S2, GT, Berkeley, UCLA","First inter-university call + shared repo"]},
  {num:7,date:"2027-01-05",end:"2027-02-28",name:"FPGA / ASIC MVP",accent:"#e879aa",
   tasks:["FPGA port of systolic array","SPI/UART host interface","Python → hardware end-to-end demo"]},
  {num:8,date:"2027-02-01",end:"2027-03-31",name:"ChipIgnite proposal",accent:"#f5a830",
   tasks:["Study theme + adapt project","System: chip + PCB + demo","Write + submit full proposal"]},
  {num:9,date:"2027-04-01",end:"2027-05-15",name:"Public demo + next chip",accent:"#2dd4a0",
   tasks:["Live demo to ECE/CSE/IEEE","Publish GitHub + writeup","Plan second chip + sponsorship push"]},
];

const TICKS = [
  {label:"May '26",date:"2026-05-11",major:true},
  {label:"Jun",    date:"2026-06-01",major:false},
  {label:"Jul",    date:"2026-07-01",major:false},
  {label:"Aug",    date:"2026-08-01",major:false},
  {label:"Sep",    date:"2026-09-01",major:true},
  {label:"Oct",    date:"2026-10-01",major:false},
  {label:"Nov",    date:"2026-11-01",major:false},
  {label:"Dec",    date:"2026-12-01",major:false},
  {label:"Jan '27",date:"2027-01-01",major:true},
  {label:"Feb",    date:"2027-02-01",major:false},
  {label:"Mar",    date:"2027-03-01",major:false},
  {label:"Apr",    date:"2027-04-01",major:false},
  {label:"May '27",date:"2027-05-15",major:true},
];

function p(ds){ return Math.min(Math.max((new Date(ds)-START)/TOTAL,0),1); }
function status(s,e){
  const sd=new Date(s),ed=new Date(e);
  if(ed<NOW) return "done";
  if(sd<=NOW&&NOW<=ed) return "now";
  return "soon";
}
function fmtShort(ds){ return new Date(ds).toLocaleDateString("en-US",{month:"short",day:"numeric"}); }

document.getElementById("chip-today").textContent =
  NOW.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",year:"numeric"});
document.getElementById("chip-days").textContent =
  Math.max(0,Math.round((NOW-START)/86400000))+" days in";
const mid=new Date((START.getTime()+END.getTime())/2);
document.getElementById("prog-mid").textContent =
  mid.toLocaleDateString("en-US",{month:"short",year:"numeric"});
setTimeout(()=>{
  document.getElementById("prog-fill").style.width=(PCT*100)+"%";
  document.getElementById("spine-fill").style.width=(PCT*100)+"%";
  const rem=Math.max(0,Math.round((END-NOW)/86400000));
  document.getElementById("prog-sub").textContent =
    Math.round(PCT*100)+"% through year one · "+rem+" days remaining";
},200);

/* Ticks */
const ticksEl=document.getElementById("ticks");
TICKS.forEach(t=>{
  const el=document.createElement("div");
  el.className="tl-tick"+(t.major?" major":"");
  el.style.left=(p(t.date)*100)+"%";
  el.textContent=t.label;
  ticksEl.appendChild(el);
});

/* Shared tooltip element */
const tooltip = document.getElementById("tooltip");
const TIP_W = 210;
const TIP_GAP = 16;

function showTip(ph, dotEl) {
  const st = status(ph.date, ph.end);
  const bdCls = st==="done"?"bd-done":st==="now"?"bd-now":"bd-soon";
  const bdTxt = st==="done"?"complete":st==="now"?"in progress":"upcoming";

  tooltip.innerHTML = `
    <div class="tt-phase" style="color:${ph.accent}">Phase ${ph.num}</div>
    <div class="tt-name">${ph.name}</div>
    <div class="tt-dates">${fmtShort(ph.date)} → ${fmtShort(ph.end)}</div>
    <div class="tt-tasks">${ph.tasks.map(t=>`<div class="tt-task">${t}</div>`).join("")}</div>
    <span class="tt-badge ${bdCls}">${bdTxt}</span>`;

  /* Position relative to dot using getBoundingClientRect */
  const r = dotEl.getBoundingClientRect();
  const dotCX = r.left + r.width / 2;
  const dotCY = r.top + r.height / 2;

  /* Make visible but transparent to measure height */
  tooltip.style.opacity = "0";
  tooltip.style.display = "block";
  const tipH = tooltip.offsetHeight;

  /* Try above first, fall back to below if not enough space */
  let top;
  if (dotCY - tipH - TIP_GAP > 8) {
    top = dotCY - tipH - TIP_GAP;
  } else {
    top = dotCY + TIP_GAP;
  }

  /* Horizontal: center on dot, clamp to viewport */
  let left = dotCX - TIP_W / 2;
  left = Math.max(8, Math.min(left, window.innerWidth - TIP_W - 8));

  tooltip.style.top  = top + "px";
  tooltip.style.left = left + "px";
  tooltip.style.width = TIP_W + "px";
  tooltip.classList.add("visible");
}

function hideTip() {
  tooltip.classList.remove("visible");
}

/* Dots */
const spineArea = document.getElementById("spine-area");
PHASES.forEach(ph => {
  const st = status(ph.date, ph.end);
  const dot = document.createElement("div");
  dot.className = `tl-dot${st==="done"?" done":st==="now"?" current":""}`;
  dot.style.left = (p(ph.date)*100)+"%";

  dot.addEventListener("mouseenter", () => showTip(ph, dot));
  dot.addEventListener("mouseleave", hideTip);

  spineArea.appendChild(dot);
});

/* Now marker */
const nowDot = document.createElement("div");
nowDot.className = "tl-now";
nowDot.style.left = (PCT*100)+"%";
spineArea.appendChild(nowDot);

/* Phase list */
const list = document.getElementById("phase-list");
PHASES.forEach((ph,i) => {
  const st = status(ph.date, ph.end);
  const bdCls = st==="done"?"bd-done":st==="now"?"bd-now":"bd-soon";
  const bdTxt = st==="done"?"complete":st==="now"?"in progress":"upcoming";
  let barW = 0;
  if(st==="done") barW = 100;
  else if(st==="now"){
    const ps=new Date(ph.date),pe=new Date(ph.end);
    barW=Math.round(Math.min(100,Math.max(0,(NOW-ps)/(pe-ps)*100)));
  }
  const numStr=(ph.num<10?"0":"")+ph.num;
  const row=document.createElement("div");
  row.className="ph-row";
  row.style.transitionDelay=(i*.05)+"s";
  row.innerHTML=`
    <div class="ph-num" style="color:${ph.accent}">${numStr}</div>
    <div class="ph-body">
      <div class="ph-name">${ph.name}</div>
      <div class="ph-tasks">${ph.tasks.map(t=>`<div class="ph-task">${t}</div>`).join("")}</div>
    </div>
    <div class="ph-right">
      <div class="ph-dates">${fmtShort(ph.date)}<br>${fmtShort(ph.end)}</div>
      <span class="tt-badge ${bdCls}">${bdTxt}</span>
      <div class="ph-bar"><div class="ph-bar-fill" style="background:${ph.accent};width:${barW}%"></div></div>
    </div>`;
  list.appendChild(row);
});

const obs=new IntersectionObserver(entries=>{
  entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add("show");obs.unobserve(e.target);}});
},{threshold:.05});
document.querySelectorAll(".ph-row").forEach(r=>obs.observe(r));
</script>
</body>
</html>
